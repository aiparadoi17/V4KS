<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi Sekolah</title><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></head><body>
<div id="login" class="login-page"><div class="login-card"><div class="brand-mark">AS</div><h1>Absensi Sekolah</h1><p>Portal kehadiran siswa</p><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button></form><small id="loginErr"></small></div></div>
<div id="app" class="hidden"><header class="topbar"><button class="menu-btn" onclick="toggleMenu()">☰</button><div><b id="schoolName">Absensi Sekolah</b><span id="roleBadge"></span></div><div class="top-actions"><span id="liveClock"></span><button class="logout" onclick="logout()">Keluar</button></div></header><aside id="sidebar"><button onclick="show('dashboard')">🏠 Dashboard</button><button data-admin onclick="show('students')">👨‍🎓 Data Siswa</button><button onclick="show('attendance')">📷 Absen Siswa</button><button data-admin onclick="show('reports')">📊 Laporan</button><button data-admin onclick="show('idcards')">🪪 Cetak ID Card</button><button data-admin onclick="show('settings')">⚙️ Pengaturan</button></aside><main id="main"></main></div>
<div id="modal" class="modal hidden"></div><script src="app.js"></script></body></html>
